name: Qualidade do Aurora

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python e agente offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Instalar do lock
        run: uv sync --locked --python 3.12
      - name: Lint e formatação
        run: make lint format-check lint-imports
      - name: Tipagem do agente
        run: make typecheck-agent
      - name: Testes locais de configuração
        run: uv run --locked python -m unittest discover -s configs/tests
      - name: Testes do agente com modelos locais
        run: make test-agent-offline

  web:
    name: Frontend bônus offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Instalar do lock
        run: npm ci --no-audit --no-fund
      - name: Lint, testes, build e assets
        run: npm run check
