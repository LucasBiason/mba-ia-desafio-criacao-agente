[project]
name = "residencial-aurora-base"
version = "0.1.0"
description = "Plataforma administrativa e assistente do Residencial Aurora"
requires-python = ">=3.12"
dependencies = [
    "aurora-toolkit==0.1.0",
    "microservice-toolkit==0.1.0",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "google-adk[db]==2.14.1",
    "aiosqlite>=0.22,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "uvicorn>=0.34,<1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
]

[tool.uv.sources]
microservice-toolkit = { path = "infra/packages/microservice-toolkit", editable = true }
aurora-toolkit = { path = "infra/packages/aurora-toolkit", editable = true }
