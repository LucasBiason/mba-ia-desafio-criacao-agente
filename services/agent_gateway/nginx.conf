resolver 127.0.0.11 valid=5s ipv6=off;

upstream agent_api_replicas {
    zone agent_api_replicas 64k;
    server agent-a:8000 resolve;
    server agent-b:8000 resolve;
    keepalive 16;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    location / {
        proxy_pass http://agent_api_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        # Avoid replaying state-changing agent requests on another replica.
        proxy_next_upstream off;
        add_header X-Aurora-Upstream $upstream_addr always;
    }
}
