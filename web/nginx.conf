server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 1m;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location = /health {
        set $health_backend http://apartments:8000;
        proxy_pass $health_backend/health;
    }
    location = /api/health {
        set $health_backend http://apartments:8000;
        proxy_pass $health_backend/health;
    }

    location ~ ^/api/auth(?:/|$) {
        set $backend http://auth:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/admin/users(?:/|$) {
        set $backend http://users:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/(?:admin|resident)/apartments(?:/|$) {
        set $backend http://apartments:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/(?:admin/areas|areas)(?:/|$) {
        set $backend http://common-areas:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/(?:admin|resident)/reservations(?:/|$) {
        set $backend http://agenda:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/(?:admin|resident)/visits(?:/|$) {
        set $backend http://visits:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/(?:admin|resident)/regulation(?:/|$) {
        set $backend http://settings:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/api/resident/chat(?:/|$) {
        set $backend http://agent:8000;
        proxy_pass $backend$request_uri;
    }

    location ~ ^/services/(auth|users|apartments|common-areas|agenda|visits|settings|agent)/(docs|openapi\.json|redoc|health|api/.*)$ {
        set $docs_backend http://$1:8000;
        rewrite ^/services/[^/]+/(.*)$ /$1 break;
        proxy_pass $docs_backend$uri$is_args$args;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /internal/ { return 404; }
    location /api/ { return 404; }
    location /services/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / { try_files $uri $uri/ /index.html; }
}
