server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ready"}';
    }

    location ^~ /api/auth/ {
        set $auth_backend http://auth:8000;
        proxy_pass $auth_backend$request_uri;
    }

    location ~ ^/api/admin/users(?:/|$) {
        set $users_backend http://users:8000;
        proxy_pass $users_backend$request_uri;
    }

    location /api/ {
        set $condo_backend http://condo:8000;
        proxy_pass $condo_backend$request_uri;
    }

    location ^~ /internal/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / { try_files $uri $uri/ /index.html; }
}
